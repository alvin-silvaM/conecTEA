server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: /api/alunos -> http://backend:3000/alunos
    # A barra final em "location /api/" e em "proxy_pass .../" é o que remove o prefixo /api.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos do build têm hash no nome (index-AbC123.js): podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca deve ficar em cache, senão o navegador não vê novas versões.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: qualquer rota do React (/alunos, /cuidadores/123/editar...) devolve o index.html
    # e o React Router decide qual tela mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
