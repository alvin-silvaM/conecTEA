<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConecTEA - Teste da API</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>ConecTEA · Teste da API</h1>
    <span id="status" class="badge">verificando…</span>
  </header>

  <main>
    <section>
      <h2>Cadastro de Escola <small>POST /escolas/cadastro</small></h2>
      <button id="btn-preencher" type="button" class="secundario">Preencher automaticamente</button>
      <form id="form-cadastro">
        <label>CNPJ (14 dígitos) <input name="cnpj" required pattern="\d{14}" maxlength="14" /></label>
        <label>Razão social <input name="razaoSocial" required /></label>
        <fieldset>
          <legend>Endereço</legend>
          <label>Rua <input name="rua" required /></label>
          <label>Número <input name="numero" type="number" required /></label>
          <label>Município <input name="municipio" required /></label>
          <label>Estado <input name="estado" required /></label>
        </fieldset>
        <label>Telefone 1 <input name="telefone1" required /></label>
        <label>Telefone 2 (opcional) <input name="telefone2" /></label>
        <label>Email <input name="email" type="email" required /></label>
        <label>Senha <input name="senha" type="password" required /></label>
        <label class="check"><input name="ativo" type="checkbox" checked /> Ativo</label>
        <button type="submit">Cadastrar</button>
      </form>
      <pre id="res-cadastro" class="resultado"></pre>
    </section>

    <section>
      <h2>Login de Escola <small>POST /escolas</small></h2>
      <form id="form-login">
        <label>CNPJ (14 dígitos) <input name="cnpj" required pattern="\d{14}" maxlength="14" /></label>
        <label>Senha <input name="senha" type="password" required /></label>
        <button type="submit">Entrar</button>
      </form>
      <pre id="res-login" class="resultado"></pre>
      <div id="token-box" hidden>
        <strong>Token JWT salvo</strong>
        <button id="btn-logout" type="button">Limpar token</button>
      </div>
    </section>
  </main>

  <script type="module" src="/main.js"></script>
</body>
</html>
